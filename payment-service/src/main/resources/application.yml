server:
  port: 8086

spring:
  application:
    name: payment-service
  datasource:
    # Usa el mismo host dinámico que order-service
    url: jdbc:postgresql://${DB_HOST:smartlogix-db}:5432/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Mapeamos la propiedad JWT igual que en tu servicio de órdenes por si la necesitas en el filtro
jwt:
  secret: ${JWT_SECRET}

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true
  client:
    service-url:
      # Apunta al contenedor correcto del discovery-service, tal como órdenes
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka/}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000