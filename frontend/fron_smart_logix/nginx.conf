server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: cualquier ruta que no sea un archivo real
    # (orders, inventory, profile, etc.) se resuelve devolviendo
    # index.html, y React Router decide qué mostrar en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache normal para assets compilados (JS/CSS con hash en el nombre)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }
}